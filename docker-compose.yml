services:
  rtmp-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000" # dashboard
      - "4001:4001" # RTMP ingest
      - "4002:4002" # node-media-server HTTP-FLV
      # - "4443:4443" # RTMPS ingest — uncomment together with the RTMPS_* vars
    volumes:
      - ./media:/app/media
      - rtmp-data:/app/data
      # Certificates for RTMPS, read-only. Match the paths to RTMPS_KEY / RTMPS_CERT.
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      NODE_ENV: production
      # Accounts, API keys and the cookie signing secret are stored in /app/data/db.json.
      DATA_DIR: /app/data

      # First run only: the creator account. Leave CREATOR_PASSWORD unset and the generated
      # password is printed once to the container log (`docker compose logs rtmp-proxy`).
      # CREATOR_USERNAME: creator
      # CREATOR_PASSWORD: change-me-please

      # Deployment-specific values live in a .env file next to this compose file, so this
      # file stays generic. See .env.example.
      #
      # BASE_PATH: the path a reverse proxy mounts the dashboard under, e.g. /4000 for
      #   nginx `location /4000/ { proxy_pass http://localhost:4000/; }`. Without it every
      #   link and redirect the app emits escapes the mount point.
      # PUBLIC_HOST: the hostname encoders should use for RTMP. Without it the dashboard
      #   advertises the container's own IP, which nobody outside Docker can reach.
      BASE_PATH: ${BASE_PATH:-}
      PUBLIC_HOST: ${PUBLIC_HOST:-}

      # Set to "true" when the dashboard is reached over HTTPS only. Leave unset if you also
      # use it directly over plain http on the published port, or logins will not stick.
      SECURE_COOKIES: ${SECURE_COOKIES:-}

      # RTMPS ingest. The API key rides on the Server URL, and plain RTMP sends that in the
      # clear, so an encrypted endpoint is worth having. To enable: set these three in .env,
      # uncomment the 4443 port and the certificate mount below.
      RTMPS_PORT: ${RTMPS_PORT:-}
      RTMPS_KEY: ${RTMPS_KEY:-}
      RTMPS_CERT: ${RTMPS_CERT:-}

      # Where streams are forwarded when an API key has no destination of its own.
      # rtmps by default: this leg carries the destination's stream key across the public
      # internet, and plain rtmp would send it in the clear.
      DEFAULT_RELAY_EDGE: ${DEFAULT_RELAY_EDGE:-rtmps://a.rtmps.youtube.com/live2}

      # How many API keys a new account may hold. The creator can override this per account.
      DEFAULT_KEY_QUOTA: "2"

    # The in-app "Restart server" button exits the process; this policy brings it straight back.
    # Do not change it to "no" or "on-failure" with a retry cap, or the button becomes a stop button.
    restart: unless-stopped

volumes:
  rtmp-data:
